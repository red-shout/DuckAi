name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          # کپی فایل‌های اصلی وب در پوشه www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" -o -name "*.css" \) -exec cp {} www/ \;
          ls -la www/

      - name: Setup Capacitor and Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DuckAi" "tech.okyo.duckai" --web-dir "www"
          npx cap add android
          npx cap sync

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuckAi-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
