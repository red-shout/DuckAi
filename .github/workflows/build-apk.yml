name: Smart Build DuckAi APK (Xiaomi Pad 7 Edition)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5. Auto-Detect & Build Project
        run: |
          echo "🔍 در حال تشخیص هوشمند ساختار پروژه DuckAi..."
          
          # حالت ۱: اگر پروژه از قبل پوشه اندروید یا Gradle دارد
          if [ -f "gradlew" ] || [ -f "android/gradlew" ]; then
            echo "✅ پروژه دارای ساختار بومی اندروید است."
            if [ -f "package.json" ]; then npm install && npm run build || true; fi
            exit 0
          fi

          # حالت ۲: پروژه وب است (React, Vite, Next.js, Vue یا HTML/JS)
          mkdir -p www_final
          if [ -f "package.json" ]; then
            echo "📦 نصب پکیج‌های Node.js..."
            npm install --legacy-peer-deps || npm install --force
            
            # تنظیم مسیر نسبی برای جلوگیری از صفحه سفید در اندروید
            export PUBLIC_URL="."
            npm run build -- --base=./ || npm run build || true
          fi

          # پیدا کردن فایل‌های خروجی ساخته شده
          if [ -d "dist" ]; then cp -r dist/* www_final/;
          elif [ -d "build" ]; then cp -r build/* www_final/;
          elif [ -d "out" ]; then cp -r out/* www_final/;
          elif [ -f "index.html" ]; then
            rsync -av --exclude='node_modules' --exclude='.git' --exclude='www_final' ./ www_final/
          else
            # اگر فایل index.html در زیرپوشه‌ها بود
            FOUND_INDEX=$(find . -maxdepth 3 -name "index.html" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp -r $(dirname "$FOUND_INDEX")/* www_final/
            else
              echo "<!DOCTYPE html><html dir='rtl'><body style='background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;'><h2>پروژه DuckAi آماده است</h2></body></html>" > www_final/index.html
            fi
          fi

          # تبدیل به پروژه اندروید با Capacitor
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DuckAi" "com.okyo.duckai" --web-dir www_final
          npx cap add android

      - name: 6. Optimize for Xiaomi Pad 7 (Landscape, Hardware & Auto-Permissions)
        run: |
          MANIFEST=$(find . -path "*/src/main/AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST" ]; then exit 0; fi
          echo "⚙️ اعمال تنظیمات اختصاصی شیائومی پد ۷ روی: $MANIFEST"

          # ۱. افقی کردن دوطرفه (sensorLandscape)، شتاب‌دهنده سخت‌افزاری و تطبیق با نسبت 3:2
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:resizeableActivity="true"/g' "$MANIFEST"

          # ۲. تزریق مجوزهای سخت‌افزاری (میکروفون، دوربین، فایل، اینترنت بدون محدودیت)
          PERMS='<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />\n<uses-feature android:name="android.hardware.microphone" android:required="false" />'
          sed -i "s|<application|$PERMS\n<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\"|g" "$MANIFEST"

          # ۳. کدنویسی جاوا برای درخواست خودکار مجوزها در بدو ورود + تمام‌صفحه واقعی
          MAIN_ACT=$(find . -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.okyo.duckai;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // روشن ماندن دائمی صفحه تبلت و حالت تمام‌صفحه بدون نوارهای مزاحم
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemUI();

                  // درخواست خودکار دسترسی میکروفون و دوربین روی تبلت در اولین اجرا
                  requestTabletPermissions();

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings ws = this.bridge.getWebView().getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setMediaPlaybackRequiresUserGesture(false); // پخش خودکار صدا و پاسخ‌های صوتی هوش مصنوعی
                      ws.setAllowFileAccess(true);
                      ws.setAllowContentAccess(true);

                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              request.grant(request.getResources());
                          }
                      });
                  }
              }

              private void requestTabletPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] perms = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.CAMERA
                      };
                      List<String> listPermissionsNeeded = new ArrayList<>();
                      for (String p : perms) {
                          if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                              listPermissionsNeeded.add(p);
                          }
                      }
                      if (!listPermissionsNeeded.isEmpty()) {
                          ActivityCompat.requestPermissions(this, listPermissionsNeeded.toArray(new String[0]), 100);
                      }
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          }
          EOF
          fi

      - name: 7. Compile APK
        run: |
          if [ -d "android" ]; then cd android; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: DuckAi-XiaomiPad7-Installable
          path: "**/build/outputs/apk/debug/*.apk"
