name: Simple Build DuckAi APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web & Create Android App
        run: |
          # 1. بیلد پروژه وب (اگر پکیج جاواسکریپت باشد)
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install --force || true
            export PUBLIC_URL="."
            npm run build -- --base=./ || npm run build || true
          fi

          # 2. آماده‌سازی پوشه وب
          mkdir -p www_folder
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then cp -r dist/* www_folder/;
          elif [ -d "build" ] && [ "$(ls -A build)" ]; then cp -r build/* www_folder/;
          elif [ -d "out" ] && [ "$(ls -A out)" ]; then cp -r out/* www_folder/;
          elif [ -f "index.html" ]; then
            rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' ./ www_folder/
          else
            FOUND_INDEX=$(find . -maxdepth 3 -name "index.html" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp -r $(dirname "$FOUND_INDEX")/* www_folder/
            fi
          fi

          if [ ! -f "www_folder/index.html" ]; then
            echo "<!DOCTYPE html><html dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'></head><body style='background:#121212;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;'><h2>DuckAi Ready</h2></body></html>" > www_folder/index.html
          fi

          # 3. ساختار اندروید با کاپاسیتور
          npm init -y || true
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "DuckAi" "com.okyo.duckai" --web-dir www_folder
          npx cap add android

      - name: Optimize Manifest for Xiaomi Pad 7
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # تنظیم حالت افقی و شتاب‌دهنده
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:resizeableActivity="true"/g' "$MANIFEST"
          
          # افزودن دسترسی‌ها
          PERMS='<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.CAMERA" />'
          sed -i "s|<application|$PERMS\n<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\"|g" "$MANIFEST"

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckAi-XiaomiPad7-Installable
          path: android/app/build/outputs/apk/debug/app-debug.apk
